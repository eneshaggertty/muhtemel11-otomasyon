name: Özel paylaşım

on:
  workflow_dispatch:
    inputs:
      gorseller:
        description: "Repo'daki görsel yolları, boşlukla ayrılmış (örn. posts/ozel/x.jpg)"
        type: string
        required: true
      aciklama:
        description: "Açıklama metninin olduğu dosya (örn. posts/ozel/x.txt)"
        type: string
        required: true

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Paylaş
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python ozel_paylas.py ${{ inputs.gorseller }} --aciklama "${{ inputs.aciklama }}"
