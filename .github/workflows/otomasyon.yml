name: Muhtemel11 Otomasyon

on:
  schedule:
    # Her 15 dakikada bir, İstanbul saatiyle 10:00 - 01:59 arası (cron UTC'dir)
    - cron: "*/15 7-22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test modu (paylaşmaz, sadece görselleri üretir)"
        type: boolean
        default: true
      tarih:
        description: "Test için geçmiş bir gün (örn. 2026-10-26). Boş bırakırsan bugün."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: otomasyon
  cancel-in-progress: false

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Git kimliği
        run: |
          git config user.name "muhtemel11-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Çalıştır
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          TEST_TARIH: ${{ inputs.tarih }}
        shell: bash
        run: |
          mkdir -p posts_test
          python main.py 2>&1 | tee posts_test/calisma.log
      - name: Durumu kaydet
        if: always()
        run: |
          mkdir -p posts
          git add -A posts state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "durum güncellendi"
          git pull --rebase -q && git push -q
      - name: Test sonuçlarını test-sonuc dalına koy
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          [ -d posts_test ] || exit 0
          git checkout -q --orphan test-sonuc
          git rm -rq --cached .
          git add -f posts_test
          git commit -q -m "test sonuçları"
          git push -qf origin test-sonuc
      - name: Test görsellerini indirilebilir yap
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gorseller
          path: posts_test/
          if-no-files-found: ignore
