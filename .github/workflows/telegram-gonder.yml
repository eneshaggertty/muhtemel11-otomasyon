name: Telegram'a gönder

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Repo'daki video yolu (örn. posts/ozel/x.mp4)"
        required: true
      aciklama:
        description: "Açıklama dosyası (örn. posts/ozel/x.txt)"
        required: true
      muzik:
        description: "Müzik önerisi (örn. Galatasaray Marşı)"
        default: ""

jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_gonder.py "${{ inputs.video }}" "${{ inputs.aciklama }}" "${{ inputs.muzik }}"
